<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Catch Me If You Can - Phase 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:#fff;height:100vh;overflow:hidden;touch-action:manipulation}
.screen{width:100%;height:100vh}
#start,#end{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;padding:20px;text-align:center}
#game{display:none;position:relative}
input,button{border:none;border-radius:12px}
input{padding:14px;width:min(320px,90vw);font-size:18px}
.startBtn{padding:14px 22px;font-size:18px}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:20px;z-index:10}
#msg{position:fixed;top:55px;left:10px;right:10px;text-align:center;font-weight:bold;font-size:24px}
#btn{position:absolute;min-width:140px;min-height:70px;padding:18px 28px;font-size:22px;border-radius:20px}
.fire{animation:fire .4s infinite alternate}
@keyframes fire{from{box-shadow:0 0 10px orange}to{box-shadow:0 0 35px red,0 0 60px orange}}
#board{position:fixed;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.08);padding:10px;border-radius:12px}
#jump{display:none;position:fixed;inset:0;background:#000d;z-index:100;justify-content:center;align-items:center;font-size:42px;text-align:center;padding:20px}
.shake{animation:shake .3s}
@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-8px)}
50%{transform:translateX(8px)}
75%{transform:translateX(-8px)}
}
#end{display:none}
</style>
</head>
<body>
<div id="start" class="screen">
<h1>🔥 CHAOS GAME PHASE 2 🔥</h1>
<input id="name" placeholder="Enter your name">
<button class="startBtn" onclick="startGame()">START CHAOS</button>
</div>

<div id="game" class="screen">
<div id="top"><div>Score: <span id="score">0</span></div><div>Combo: <span id="combo">0</span></div></div>
<div id="msg">Catch the button 😈</div>
<button id="btn">CLICK ME</button>
<div id="board"><h3>🏆 Top Players</h3><ol id="list"></ol></div>
</div>

<div id="jump"></div>

<div id="end" class="screen">
<h1>🎉 CHAOS COMPLETE 🎉</h1>
<h2 id="final"></h2>
</div>

<script>
let score=0,combo=0,player="",timer,challenge=null;
const btn=btn=document.getElementById('btn');
const msg=document.getElementById('msg');

const jumps=["SKILL ISSUE 💀","HE'S LOCKED IN 🔥","ABSOLUTE CINEMA 🎬","TOO SLOW GRANDPA 😭","MAIN CHARACTER MOMENT 👑"];
const challenges=[
"DOUBLE CLICK NOW ⚡",
"DON'T CLICK FOR 2 SECONDS 😈",
"CLICK WITH HONOR 🫡",
"SPEED ROUND 🔥"
];

function startGame(){
player=name.value.trim();
if(!player)return alert("Enter name");
start.style.display="none";
game.style.display="block";
updateBoard();
move();
resetTimer();
setInterval(randomChallenge,12000);
}

function clickHandler(e){
e.preventDefault();
score++;
combo++;

if(combo>=3){btn.classList.add("fire");score++;navigator.vibrate?.(70);}

if(Math.random()<0.15) triggerJump();
if(Math.random()<0.12) document.body.classList.add("shake"),setTimeout(()=>document.body.classList.remove("shake"),300);

document.getElementById("score").textContent=score;
document.getElementById("combo").textContent=combo;

randomSize();
move();
resetTimer();

if(score>=50) endGame();
}

btn.addEventListener("click",clickHandler);
btn.addEventListener("touchstart",clickHandler,{passive:false});

function move(){
const maxX=window.innerWidth-btn.offsetWidth;
const maxY=window.innerHeight-btn.offsetHeight-170;
btn.style.left=Math.random()*Math.max(0,maxX)+"px";
btn.style.top=(100+Math.random()*Math.max(0,maxY-100))+"px";
}

function randomSize(){
const r=Math.random();
if(r<0.2){btn.style.transform="scale(.7)";msg.textContent="GOOD LUCK FINDING IT 💀";}
else if(r>0.8){btn.style.transform="scale(1.5)";msg.textContent="EVEN YOU CAN'T MISS THIS 😭";}
else btn.style.transform="scale(1)";
}

function triggerJump(){
const j=document.getElementById("jump");
j.style.display="flex";
j.textContent=jumps[Math.floor(Math.random()*jumps.length)];
setTimeout(()=>j.style.display="none",1200);
}

function randomChallenge(){
challenge=challenges[Math.floor(Math.random()*challenges.length)];
msg.textContent="🎯 "+challenge;
}

function resetTimer(){
clearTimeout(timer);
timer=setTimeout(()=>{
combo=0;
document.getElementById("combo").textContent=0;
btn.classList.remove("fire");
msg.textContent="Your fire was extinguished 😭";
},3000);
}

function endGame(){
save();
game.style.display="none";
end.style.display="flex";
final.textContent=player+" scored "+score;
}

function save(){
let s=JSON.parse(localStorage.getItem("chaosScores")||"[]");
s.push({name:player,score});
s.sort((a,b)=>b.score-a.score);
localStorage.setItem("chaosScores",JSON.stringify(s.slice(0,3)));
}

function updateBoard(){
let s=JSON.parse(localStorage.getItem("chaosScores")||"[]");
list.innerHTML="";
s.forEach(x=>{
const li=document.createElement("li");
li.textContent=x.name+" - "+x.score;
list.appendChild(li);
});
}
</script>
</body>
</html>
