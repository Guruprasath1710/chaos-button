<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>
🔥 Catch Me If You Can 🔥
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#111;
    color:white;

    width:100vw;
    height:100vh;

    overflow:hidden;

    touch-action:manipulation;
}

#startScreen,
#gameScreen,
#endScreen{

    width:100%;
    height:100vh;
}

#startScreen,
#endScreen{

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:15px;

    text-align:center;

    padding:20px;
}

#gameScreen{

    display:none;
    position:relative;
}

h1{

    font-size:
    clamp(2rem,6vw,3rem);
}

input{

    width:min(320px,90vw);

    padding:14px;

    border:none;

    border-radius:12px;

    font-size:18px;
}

.startBtn{

    padding:14px 24px;

    border:none;

    border-radius:12px;

    font-size:18px;

    cursor:pointer;
}

#topBar{

    position:fixed;

    top:10px;
    left:10px;
    right:10px;

    display:flex;

    justify-content:space-between;

    font-size:18px;

    z-index:100;
}

#message{

    position:fixed;

    top:60px;

    left:10px;
    right:10px;

    text-align:center;

    font-size:
    clamp(18px,5vw,28px);

    font-weight:bold;

    z-index:100;
}

#chaosBtn{

    position:absolute;

    min-width:140px;
    min-height:70px;

    padding:20px 30px;

    border:none;

    border-radius:20px;

    font-size:22px;

    cursor:pointer;

    transition:
    transform .15s,
    box-shadow .15s,
    left .08s,
    top .08s;
}

.fire{

    animation:
    fireGlow .5s infinite alternate;
}

@keyframes fireGlow{

    from{

        box-shadow:
        0 0 10px orange;
    }

    to{

        box-shadow:
        0 0 25px red,
        0 0 50px orange;
    }
}

#leaderboard{

    position:fixed;

    left:10px;
    right:10px;

    bottom:10px;

    background:
    rgba(255,255,255,.08);

    padding:10px;

    border-radius:12px;

    backdrop-filter:blur(6px);
}

#leaderboard h3{

    margin-bottom:10px;
}

#leaderboard ol{

    padding-left:22px;
}

#endScreen{

    display:none;
}

#finalScore{

    margin-top:10px;
}

.scoreHighlight{

    animation:
    pulse .5s;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

    100%{
        transform:scale(1);
    }
}

.heartGain{

    color:#00ff88;
}

.heartLoss{

    color:#ff4d4d;
}

</style>

</head>

<body>

<div id="startScreen">

    <h1>
        🔥 Catch Me If You Can 🔥
    </h1>

    <input
    id="playerName"
    placeholder="Enter your name">

    <button
    class="startBtn"
    onclick="startGame()">

        START CHAOS

    </button>

</div>

<div id="gameScreen">

    <div id="topBar">

        <div>
            Score:
            <span id="score">
                0
            </span>
        </div>

        <div>
            Combo:
            <span id="combo">
                0
            </span>
        </div>

        <div>
            ❤️
            <span id="lives">
                3
            </span>
        </div>

    </div>

    <div id="message">

        Catch the button 😈

    </div>

    <button id="chaosBtn">

        CLICK ME

    </button>

    <div id="leaderboard">

        <h3>
            🏆 Top Players
        </h3>

        <ol id="leaderboardList">

        </ol>

    </div>

</div>

<div id="endScreen">

    <h1>
        🎮 Game Over
    </h1>

    <h2 id="finalScore">

    </h2>

    <p>

        Thanks for playing 😭

    </p>

</div>
<script>

let playerName = "";
let score = 0;
let combo = 0;
let lives = 3;

const btn = document.getElementById("chaosBtn");
const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const livesEl = document.getElementById("lives");
const messageEl = document.getElementById("message");

const commands = [
    "CLICK FAST ⚡",
    "DOUBLE CLICK 😈",
    "DON'T MISS 😭",
    "CLICK WITH HONOR 🫡",
    "LOCK IN 🔥"
];

const jumpscares = [
    "SKILL ISSUE 💀",
    "TOUCH GRASS 🌱",
    "BRO IS LOCKED IN 🔥",
    "BUTTON FEARS YOU 😨"
];

function startGame(){

    playerName =
        document.getElementById("playerName")
        .value
        .trim();

    if(!playerName){
        alert("Enter your name!");
        return;
    }

    document.getElementById("startScreen")
        .style.display = "none";

    document.getElementById("gameScreen")
        .style.display = "block";

    loadLeaderboard();

    moveButton();
}

btn.addEventListener("click", () => {

    score++;
    combo++;

    scoreEl.innerText = score;
    comboEl.innerText = combo;

    if(combo >= 3){

        btn.classList.add("fire");

        score += 2;

        scoreEl.innerText = score;

        messageEl.innerText =
            `🔥 COMBO x${combo} 🔥`;
    }

    randomButtonSize();

    randomCommand();

    randomJumpscare();

    moveButton();
});

function moveButton(){

    const x =
        Math.random() *
        (window.innerWidth - 180);

    const y =
        Math.random() *
        (window.innerHeight - 220);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

function randomButtonSize(){

    const r = Math.random();

    if(r < 0.15){

        btn.style.transform =
            "scale(0.6)";

        messageEl.innerText =
            "GOOD LUCK FINDING IT 💀";
    }

    else if(r > 0.85){

        btn.style.transform =
            "scale(1.7)";

        messageEl.innerText =
            "EVEN YOU CAN'T MISS THIS 😭";
    }

    else{

        btn.style.transform =
            "scale(1)";
    }
}

function randomCommand(){

    if(Math.random() < 0.25){

        messageEl.innerText =
            commands[
                Math.floor(
                    Math.random() *
                    commands.length
                )
            ];
    }
}

function randomJumpscare(){

    if(Math.random() < 0.08){

        const scare =
            document.createElement("div");

        scare.style.position = "fixed";
        scare.style.inset = "0";
        scare.style.background = "black";
        scare.style.display = "flex";
        scare.style.alignItems = "center";
        scare.style.justifyContent = "center";
        scare.style.fontSize = "4rem";
        scare.style.zIndex = "9999";

        scare.innerText =
            jumpscares[
                Math.floor(
                    Math.random() *
                    jumpscares.length
                )
            ];

        document.body.appendChild(scare);

        setTimeout(() => {

            scare.remove();

        },1000);
    }
}

let missTimer;

function resetMissTimer(){

    clearTimeout(missTimer);

    missTimer = setTimeout(() => {

        lives--;

        livesEl.innerText = lives;

        combo = 0;

        comboEl.innerText = combo;

        btn.classList.remove("fire");

        messageEl.innerText =
            "💧 Fire extinguished";

        if(lives <= 0){

            endGame();
        }

    },4000);
}

document.addEventListener("click",(e)=>{

    if(e.target !== btn){

        resetMissTimer();
    }
});

function endGame(){

    saveScore();

    document.getElementById("gameScreen")
        .style.display = "none";

    document.getElementById("endScreen")
        .style.display = "flex";

    document.getElementById("finalScore")
        .innerText =
        `${playerName} scored ${score}`;
}

function saveScore(){

    let scores =
        JSON.parse(
            localStorage.getItem("chaosScores")
        ) || [];

    scores.push({
        name: playerName,
        score: score
    });

    scores.sort(
        (a,b)=>b.score-a.score
    );

    scores = scores.slice(0,3);

    localStorage.setItem(
        "chaosScores",
        JSON.stringify(scores)
    );
}

function loadLeaderboard(){

    const list =
        document.getElementById(
            "leaderboardList"
        );

    list.innerHTML = "";

    const scores =
        JSON.parse(
            localStorage.getItem("chaosScores")
        ) || [];

    scores.forEach(player=>{

        const li =
            document.createElement("li");

        li.textContent =
            `${player.name} - ${player.score}`;

        list.appendChild(li);
    });
}

</script>
