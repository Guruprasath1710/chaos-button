<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch Me If You Can 😈</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

h1{
    position:absolute;
    top:30px;
    text-align:center;
    padding:10px;
}

#score{
    position:absolute;
    top:90px;
    font-size:24px;
}

#btn{
    padding:18px 35px;
    font-size:22px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    position:absolute;
    transition:left .1s, top .1s, transform .2s;
}

/* Jumpscare */

#jumpscare{
    position:fixed;
    inset:0;
    background:red;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:150px;
    z-index:9999;
    animation:shake .1s infinite;
}

@keyframes shake{

    0%{transform:translate(5px,5px);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,-5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(5px,5px);}
}

</style>
</head>

<body>

<h1 id="text">Catch the button 😈</h1>

<div id="score">Score: 0</div>

<button id="btn">CLICK ME</button>

<div id="jumpscare">
💀👹💀
</div>

<script>

const btn = document.getElementById("btn");
const text = document.getElementById("text");
const scoreText = document.getElementById("score");
const jumpscare = document.getElementById("jumpscare");

let score = 0;

const messages = [
    "TOO SLOW 💀",
    "ALMOST 😭",
    "SKILL ISSUE 🔥",
    "TRY HARDER 😈",
    "NOPE 👹",
    "BRO MISSED 💀"
];

function rand(){
    return Math.floor(Math.random()*255);
}

function moveButton(){

    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    btn.style.left = x + "px";
    btn.style.top = y + "px";

    document.body.style.background =
    `rgb(${rand()},${rand()},${rand()})`;

    text.innerText =
    messages[Math.floor(Math.random()*messages.length)];
}

// Desktop
btn.addEventListener("mouseover", () => {

    let chance = 0;

    if(score >= 5) chance = 0.25;
    if(score >= 10) chance = 0.50;
    if(score >= 15) chance = 0.75;

    if(Math.random() < chance){
        moveButton();
    }
});

// Mobile
btn.addEventListener("touchstart", (e) => {

    let chance = 0;

    if(score >= 5) chance = 0.20;
    if(score >= 10) chance = 0.40;
    if(score >= 15) chance = 0.60;

    if(Math.random() < chance){
        e.preventDefault();
        moveButton();
    }
});

// Successful click
btn.addEventListener("click", () => {

    score++;

    scoreText.innerText = "Score: " + score;

    text.innerText = "YOU GOT IT 😭";

    // Shrink button slightly
    const scale = Math.max(0.5, 1 - score * 0.02);
    btn.style.transform = `scale(${scale})`;

    // Jumpscare at score 5
    if(score === 5){

        jumpscare.style.display = "flex";

        setTimeout(() => {
            jumpscare.style.display = "none";
        }, 800);
    }

    moveButton();
});

</script>

</body>
</html>
