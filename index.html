<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Catch Me If You Can 🔥</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
    height:100vh;
    overflow:hidden;
    touch-action:manipulation;
    transition:background .3s;
}

#startScreen,
#gameScreen,
#endScreen{
    width:100%;
    height:100vh;
}

#startScreen,
#endScreen{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    text-align:center;
    padding:20px;
}

#gameScreen{
    display:none;
    position:relative;
}

input{
    width:min(320px,90vw);
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:18px;
}

.startBtn{
    padding:14px 24px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

#topBar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    z-index:100;
    font-weight:bold;
}

#message{
    position:fixed;
    top:60px;
    left:10px;
    right:10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

#chaosBtn{
    position:absolute;
    min-width:140px;
    min-height:70px;
    padding:20px 30px;
    font-size:22px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    transition:transform .15s;
}

.fire{
    animation:fireGlow .5s infinite alternate;
}

@keyframes fireGlow{

    from{
        box-shadow:0 0 10px orange;
    }

    to{
        box-shadow:
        0 0 20px orange,
        0 0 40px red,
        0 0 60px yellow;
    }
}

#leaderboard{
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
    background:rgba(255,255,255,.12);
    padding:10px;
    border-radius:12px;
}

#leaderboard h3{
    margin-bottom:8px;
}

#leaderboard ol{
    padding-left:22px;
}

#endScreen{
    display:none;
}

</style>
</head>

<body>

<div id="startScreen">

    <h1>🔥 Catch Me If You Can 🔥</h1>

    <input
        id="playerName"
        placeholder="Enter your name">

    <button
        class="startBtn"
        onclick="startGame()">
        START CHAOS
    </button>

</div>

<div id="gameScreen">

    <div id="topBar">

        <div>
            Score:
            <span id="score">0</span>
        </div>

        <div>
            Combo:
            <span id="combo">0</span>
        </div>

        <div>
            Level:
            <span id="level">1</span>
        </div>

    </div>

    <div id="message">
        Catch the button 😈
    </div>

    <button id="chaosBtn">
        CLICK ME
    </button>

    <div id="leaderboard">

        <h3>🏆 Top Players</h3>

        <ol id="leaderboardList"></ol>

    </div>

</div>

<div id="endScreen">

    <h1>🎉 YOU WON 🎉</h1>

    <h2 id="finalScore"></h2>

    <p>
        Touching grass is recommended 😭
    </p>

</div>

<script>

let score = 0;
let combo = 0;
let playerName = "";
let missTimer;

const btn = document.getElementById("chaosBtn");

const scoreText =
document.getElementById("score");

const comboText =
document.getElementById("combo");

const levelText =
document.getElementById("level");

const message =
document.getElementById("message");

const messages = [

"TOO SLOW 💀",
"NICE TRY 😭",
"LOCK IN 🔥",
"SKILL ISSUE 😈",
"ABSOLUTE CINEMA 🎬",
"MAIN CHARACTER MOMENT ✨"

];

function startGame(){

    playerName =
    document
    .getElementById("playerName")
    .value
    .trim();

    if(!playerName){

        alert("Enter your name!");

        return;
    }

    document
    .getElementById("startScreen")
    .style.display = "none";

    document
    .getElementById("gameScreen")
    .style.display = "block";

    updateLeaderboard();

    moveButton();

    resetMissTimer();
}

function getDifficulty(){

    if(score < 25) return 1;
    if(score < 50) return 2;
    if(score < 100) return 3;
    if(score < 150) return 4;
    if(score < 200) return 5;
    if(score < 250) return 6;
    if(score < 300) return 7;
    if(score < 350) return 8;
    if(score < 400) return 9;
    if(score < 450) return 10;

    return 11;
}

function randomColor(){

    const hue =
    Math.floor(
        Math.random() * 360
    );

    return `hsl(${hue},80%,50%)`;
}

function handleClick(e){

    e.preventDefault();

    score++;

    combo++;

    document.body.style.background =
    randomColor();

    if(combo >= 3){

        btn.classList.add("fire");

        score += 1;

        if(navigator.vibrate){

            navigator.vibrate(60);
        }
    }

    scoreText.textContent = score;

    comboText.textContent = combo;

    levelText.textContent =
    getDifficulty();

    randomMessage();

    randomSize();

    moveButton();

    resetMissTimer();

    if(score >= 500){

        endGame();
    }
}

btn.addEventListener(
"click",
handleClick
);

btn.addEventListener(
"touchstart",
handleClick,
{passive:false}
);

function randomMessage(){

    message.innerText =

    messages[
        Math.floor(
            Math.random() *
            messages.length
        )
    ];
}

function randomSize(){

    const level =
    getDifficulty();

    let minScale = .7;

    let maxScale = 1.5;

    if(level >= 4){

        minScale = .5;
    }

    if(level >= 7){

        minScale = .35;
    }

    if(level >= 9){

        minScale = .25;
    }

    if(level >= 11){

        minScale = .18;
    }

    if(score >= 450){

        btn.style.transform =
        `scale(${0.12 + Math.random()*0.08})`;

        return;
    }

    const scale =

    minScale +

    Math.random() *

    (maxScale - minScale);

    btn.style.transform =
    `scale(${scale})`;
}

function moveButton(){

    const maxX =

    Math.max(
        0,
        window.innerWidth -
        btn.offsetWidth
    );

    const maxY =

    Math.max(
        120,
        window.innerHeight -
        btn.offsetHeight -
        170
    );

    btn.style.left =
    Math.random() * maxX + "px";

    btn.style.top =
    120 +
    Math.random() *
    (maxY - 120)
    + "px";

    if(getDifficulty() >= 8){

        setTimeout(()=>{

            btn.style.left =
            Math.random() * maxX + "px";

            btn.style.top =
            120 +
            Math.random() *
            (maxY - 120)
            + "px";

        },200);
    }
}

function resetMissTimer(){

    clearTimeout(missTimer);

    let timeout = 3000;

    if(score > 100)
    timeout = 2500;

    if(score > 200)
    timeout = 2000;

    if(score > 300)
    timeout = 1500;

    if(score > 400)
    timeout = 1000;

    missTimer =

    setTimeout(()=>{

        combo = 0;

        comboText.textContent =
        combo;

        btn.classList.remove(
            "fire"
        );

        message.innerText =
        "Your fire was extinguished 😭";

    },timeout);
}

function endGame(){

    saveScore();

    document
    .getElementById("gameScreen")
    .style.display="none";

    document
    .getElementById("endScreen")
    .style.display="flex";

    document
    .getElementById("finalScore")
    .innerText =

    playerName +

    " scored " +

    score;
}

function saveScore(){

    let scores =

    JSON.parse(

    localStorage.getItem(
        "chaosScores"
    )

    ) || [];

    scores.push({

        name:playerName,
        score:score

    });

    scores.sort(
        (a,b)=>
        b.score-a.score
    );

    scores =
    scores.slice(0,3);

    localStorage.setItem(

        "chaosScores",

        JSON.stringify(scores)
    );
}

function updateLeaderboard(){

    let scores =

    JSON.parse(

    localStorage.getItem(
        "chaosScores"
    )

    ) || [];

    const list =

    document.getElementById(
        "leaderboardList"
    );

    list.innerHTML = "";

    scores.forEach(player=>{

        const li =
        document.createElement("li");

        li.textContent =

        player.name +

        " - " +

        player.score;

        list.appendChild(li);
    });
}

</script>

</body>
</html>
